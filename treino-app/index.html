<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<style>:root{color-scheme:light;padding-top:env(safe-area-inset-top);padding-bottom:env(safe-area-inset-bottom)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
</head>
<body>
<title>Treino do Prédio</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Barlow:wght@400;500;600&display=swap">
<style>
/* Layout: app de uma coluna (máx. 760px) com barra de abas fixa embaixo; cards de exercício imitam a etiqueta amarela das máquinas */
:root{
  --bg:#eceff0; --surface:#ffffff; --ink:#16181b; --muted:#5a6168; --line:#d3d8dc;
  --plate:#1e2124; --plate-ink:#eef0ec; --accent:#d6df26; --accent-ink:#191b07;
  --ok:#2b7a4b; --warn:#a76300; --bad:#b0281f; --soft:#f5f7f2;
  --display:"Barlow Condensed","Arial Narrow",Arial,sans-serif;
  --body:"Barlow",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --r:10px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#111315; --surface:#1a1d20; --ink:#eceeef; --muted:#9aa1a8; --line:#2d3135;
  --plate:#25292d; --plate-ink:#eef0ec; --accent:#d6df26; --accent-ink:#191b07;
  --ok:#5cc58a; --warn:#f0a640; --bad:#f2766b; --soft:#202418; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#111315; --surface:#1a1d20; --ink:#eceeef; --muted:#9aa1a8; --line:#2d3135;
  --plate:#25292d; --plate-ink:#eef0ec; --accent:#d6df26; --accent-ink:#191b07;
  --ok:#5cc58a; --warn:#f0a640; --bad:#f2766b; --soft:#202418; color-scheme:dark}
html,body{background:var(--bg);color:var(--ink)}
body{font-family:var(--body);font-size:16px;line-height:1.5;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 96px;font-variant-numeric:tabular-nums}
*{box-sizing:border-box}
.wrap{max-width:760px;margin:0 auto;display:flex;flex-direction:column;gap:18px;padding-block:18px 8px}
h1,h2,h3{font-family:var(--display);font-weight:700;line-height:1.1;margin:0;text-wrap:balance;letter-spacing:.01em}
h1{font-size:2.1rem;text-transform:uppercase}
h2{font-size:1.5rem;text-transform:uppercase}
h3{font-size:1.2rem}
p{margin:0}
.muted{color:var(--muted)}
.small{font-size:.875rem}
.eyebrow{font-family:var(--display);font-weight:600;text-transform:uppercase;letter-spacing:.08em;font-size:.85rem;color:var(--muted)}
.top{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap}
.brand{display:flex;flex-direction:column;gap:2px}
.mode{font-size:.8rem;color:var(--muted)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:12px;min-width:0}
.stack{display:flex;flex-direction:column;gap:12px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}
.grid3{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
/* Etiqueta de máquina */
.plate{background:var(--plate);color:var(--plate-ink);border-radius:var(--r);overflow:hidden;display:flex;flex-direction:column;min-width:0}
.plate .tab{background:var(--accent);color:var(--accent-ink);padding:8px 14px 8px;clip-path:polygon(0 0,62% 0,66% 38%,100% 38%,100% 100%,0 100%);display:flex;align-items:flex-end;justify-content:space-between;gap:10px;min-height:46px}
.plate .tab h3{font-size:1.25rem;text-transform:uppercase;padding-top:2px}
.plate .tab .num{font-family:var(--display);font-weight:700;font-size:1rem;white-space:nowrap}
.plate .body{padding:12px 14px 14px;display:flex;flex-direction:column;gap:10px}
.plate .muted{color:#aab0b5}
.rx{display:flex;flex-wrap:wrap;gap:6px}
.chip{display:inline-flex;align-items:center;gap:4px;border:1px solid currentColor;border-radius:999px;padding:1px 9px;font-size:.8rem;font-weight:500;white-space:nowrap}
.plate .chip{border-color:#4a5056;color:var(--plate-ink)}
.chip.ok{color:var(--ok)} .chip.warn{color:var(--warn)} .chip.bad{color:var(--bad)}
.chip.fill{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.muscles{font-size:.85rem;color:#aab0b5}
details{border-top:1px solid #3a3f44;padding-top:8px}
details summary{cursor:pointer;font-weight:600;font-size:.9rem;color:var(--accent)}
details ol,details ul{margin:6px 0 0;padding-left:20px;display:flex;flex-direction:column;gap:3px;font-size:.92rem}
.card details{border-top:1px solid var(--line)}
.card details summary{color:var(--ink)}
/* Séries */
.sets{display:flex;flex-direction:column;gap:6px}
.set{display:grid;grid-template-columns:28px 1fr 1fr 44px;gap:8px;align-items:center}
.set .n{font-family:var(--display);font-weight:700;color:#aab0b5;text-align:center}
.set input{width:100%;min-width:0;background:#2f3438;color:var(--plate-ink);border:1px solid #474d53;border-radius:8px;padding:9px 8px;font:inherit;font-size:1rem;text-align:center}
.set input::placeholder{color:#7f868c}
.set.done input{border-color:var(--accent)}
.chk{width:44px;height:42px;border-radius:8px;border:1px solid #474d53;background:transparent;color:var(--plate-ink);font-size:1.2rem;cursor:pointer}
.set.done .chk{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.sethead{display:grid;grid-template-columns:28px 1fr 1fr 44px;gap:8px;font-size:.75rem;text-transform:uppercase;letter-spacing:.06em;color:#aab0b5;text-align:center}
.hint{font-size:.85rem;color:#c9cdd0;background:#2a2e32;border-radius:8px;padding:6px 10px}
/* Botões e formulários */
button{font:inherit}
.btn{appearance:none;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:8px;padding:10px 16px;font-weight:600;cursor:pointer;min-height:44px}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.dark{background:var(--plate);color:var(--plate-ink);border-color:var(--plate)}
.btn.ghost{background:transparent}
.btn.danger{color:var(--bad);border-color:var(--bad);background:transparent}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn:focus-visible,.chk:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,.tabbar a:focus-visible,.daychip:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
label.f{display:flex;flex-direction:column;gap:4px;font-weight:500;font-size:.92rem;min-width:0}
label.f input,label.f select,textarea{background:var(--surface);color:var(--ink);border:1px solid var(--line);border-radius:8px;padding:10px;font:inherit;width:100%;min-width:0}
textarea{min-height:90px;resize:vertical}
fieldset{border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;margin:0;display:flex;flex-direction:column;gap:10px;min-width:0}
legend{font-family:var(--display);font-weight:700;text-transform:uppercase;letter-spacing:.04em;padding:0 6px}
.opts{display:flex;flex-wrap:wrap;gap:8px}
.opt{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--line);border-radius:8px;padding:8px 12px;cursor:pointer;background:var(--surface)}
.opt:has(input:checked){border-color:var(--ink);background:var(--soft)}
.opt input{accent-color:var(--ink)}
.q{display:flex;justify-content:space-between;gap:12px;align-items:center;border-bottom:1px solid var(--line);padding-bottom:8px;flex-wrap:wrap}
.q:last-child{border-bottom:0}
.q span{flex:1 1 240px}
.yn{display:flex;gap:6px}
/* Alertas */
.alert{border-radius:var(--r);padding:12px 14px;border:1px solid var(--line);background:var(--surface);display:flex;flex-direction:column;gap:6px;border-left:5px solid var(--warn)}
.alert.bad{border-left-color:var(--bad)} .alert.ok{border-left-color:var(--ok)} .alert.info{border-left-color:var(--accent)}
/* Dias */
.days{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px}
.daychip{flex:0 0 auto;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:8px;padding:8px 12px;cursor:pointer;text-align:left;min-height:44px}
.daychip b{font-family:var(--display);font-size:1.05rem;display:block;line-height:1.1}
.daychip.on{background:var(--plate);color:var(--plate-ink);border-color:var(--plate)}
.daychip.next::after{content:"próximo";display:block;font-size:.7rem;text-transform:uppercase;letter-spacing:.06em;color:var(--warn)}
.daychip.on.next::after{color:var(--accent)}
/* Estatísticas */
.stat{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;display:flex;flex-direction:column;gap:2px}
.stat .v{font-family:var(--display);font-weight:700;font-size:1.9rem;line-height:1}
.stat .l{font-size:.82rem;color:var(--muted)}
table{border-collapse:collapse;width:100%;font-size:.92rem}
th,td{text-align:left;padding:8px 6px;border-bottom:1px solid var(--line);vertical-align:top}
th{font-size:.75rem;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:600}
.tblwrap{overflow-x:auto}
.spark{display:block}
.thumbs{display:flex;gap:8px;flex-wrap:wrap}
.thumbs img{width:84px;height:84px;object-fit:cover;border-radius:8px;border:1px solid var(--line)}
/* Timer */
.timer{position:fixed;left:0;right:0;bottom:calc(64px + env(safe-area-inset-bottom,0px));z-index:20;display:flex;justify-content:center;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.timer .in{width:100%;max-width:760px;background:var(--accent);color:var(--accent-ink);border-radius:var(--r);padding:10px 14px;display:flex;align-items:center;gap:12px;box-shadow:0 6px 20px rgba(0,0,0,.25)}
.timer .t{font-family:var(--display);font-weight:700;font-size:2rem;line-height:1;min-width:84px}
.timer .bar{flex:1;height:6px;background:rgba(0,0,0,.18);border-radius:3px;overflow:hidden}
.timer .bar i{display:block;height:100%;background:var(--accent-ink)}
.timer button{background:transparent;border:1px solid var(--accent-ink);color:var(--accent-ink);border-radius:8px;padding:6px 10px;font-weight:600;cursor:pointer}
/* Abas */
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:21;background:var(--plate);display:flex;justify-content:center;padding-bottom:env(safe-area-inset-bottom,0px);padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px)}
.tabbar nav{display:grid;grid-template-columns:repeat(5,1fr);width:100%;max-width:760px}
.tabbar a{color:#aab0b5;text-decoration:none;text-align:center;padding:10px 2px 9px;font-family:var(--display);font-weight:600;text-transform:uppercase;letter-spacing:.04em;font-size:.86rem;border-top:3px solid transparent;min-height:58px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px}
.tabbar a svg{width:22px;height:22px}
.tabbar a.on{color:var(--accent);border-top-color:var(--accent)}
/* Ilustrações animadas (sempre sobre a etiqueta escura, iguais nos dois temas) */
:root{--ill-bg:#14171a;--fig:#eef0ec;--fig-far:#7d858c;--eq:#626a72;--eq-faint:#3a4046;--cab:#9aa1a7}
.illus{margin:0;display:grid;grid-template-columns:1fr 78px;gap:8px;background:var(--ill-bg);border-radius:8px;padding:6px;position:relative}
.illus svg{display:block;width:100%;height:auto;max-width:100%}
.illus .frames{display:flex;flex-direction:column;gap:6px;justify-content:center}
.illus .frames div{display:flex;flex-direction:column;align-items:center;gap:0;border:1px solid var(--eq-faint);border-radius:6px;padding:2px}
.illus .frames span{font-size:.7rem;text-transform:uppercase;letter-spacing:.06em;color:#aab0b5}
.illus .pp{position:absolute;left:10px;top:10px;background:rgba(0,0,0,.45);color:var(--plate-ink);border:1px solid #474d53;border-radius:6px;font-size:.75rem;padding:3px 8px;cursor:pointer}
.yt{color:var(--accent);font-weight:600;font-size:.9rem;text-decoration:none;align-self:flex-start}
.yt:hover{text-decoration:underline}
.fg-n,.fg-f{stroke-linecap:round;stroke-linejoin:round;fill:none}
.fg-n{stroke:var(--fig);stroke-width:7}
.fg-f{stroke:var(--fig-far);stroke-width:6}
.tor{stroke-width:10}
.head{fill:var(--fig)}
.eqs{stroke:var(--eq);stroke-width:4;fill:none;stroke-linecap:round;stroke-linejoin:round}
.eqp{stroke:var(--eq);stroke-width:8;fill:none;stroke-linecap:round}
.eqr{fill:var(--eq)}
.eqfaint{stroke:var(--eq-faint);stroke-width:3;fill:none}
.gnd{stroke:var(--eq-faint);stroke-width:2}
.cab{stroke:var(--cab);stroke-width:1.5;fill:none}
.wt{fill:var(--accent)}
.wt.far{opacity:.45}
.ballp{fill:#2b3035;stroke:var(--eq);stroke-width:2}
.spin{display:inline-block;width:14px;height:14px;border:2px solid currentColor;border-right-color:transparent;border-radius:50%;animation:sp .8s linear infinite;vertical-align:-2px}
@keyframes sp{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion: reduce){.spin{animation:none}}
.equip{display:flex;flex-wrap:wrap;gap:6px}
.equip .chip{color:var(--muted)}
.list{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:4px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
</style>

<div class="wrap" id="app" aria-live="polite"></div>
<div class="timer" id="timer" hidden></div>
<div class="tabbar"><nav id="tabs" aria-label="Seções">

  <a href="#perfil" data-v="perfil"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="8" r="4"/><path d="M4 21c1-4 4-6 8-6s7 2 8 6"/></svg>Perfil</a>
</nav></div>

<script>
"use strict";
/* ============================================================
   EQUIPAMENTOS DA ACADEMIA DO PRÉDIO (identificados nas fotos)
   ============================================================ */
const EQUIPAMENTOS = [
  "Puxada 2 em 1 (polia alta e baixa)", "Leg Press 45°", "Cross Smith (cross over + barra guiada + barra fixa)",
  "Banco de supino com suporte", "Banco ajustável", "Halteres sextavados", "Kettlebells", "Caneleiras",
  "Barras reta e W + anilhas", "Corda de tríceps e puxadores", "Barras fixas de parede", "Espaldar",
  "Bolas suíças", "Caixote (plyo box)", "Mini trampolim", "Colchonetes", "Esteiras", "Bikes (spinning e vertical)", "Elíptico"
];

/* ============================================================
   BANCO DE EXERCÍCIOS
   lv = nível mínimo (1 iniciante, 2 intermediário, 3 avançado)
   av = limitações que contraindicam o exercício
   t  = c composto | i isolado | t isometria/tempo
   inc = incremento sugerido de carga (kg); ps = por lado
   ============================================================ */
const EX = {};
function E(id,n,eq,m,lv,av,t,inc,s,e,extra){EX[id]=Object.assign({id,n,eq,m,lv,av,t,inc,s,e},extra||{})}

E("leg_press","Leg Press 45°","Leg Press 45°","Quadríceps, glúteos, posteriores",1,[],"c",10,
 ["Apoie toda a coluna e o quadril no encosto.","Pés na plataforma na largura do quadril, pontas levemente para fora.","Destrave e desça controlando até o joelho formar cerca de 90°, sem tirar o quadril do banco.","Empurre com o pé inteiro, sem travar o joelho no topo. Trave a máquina ao terminar."],
 ["Descer demais e “enrolar” o quadril (a lombar sai do encosto).","Joelhos caindo para dentro.","Travar o joelho totalmente estendido com carga."],
 {joelho:"Com dor no joelho, limite a descida a 70–90° e use carga moderada."});
E("agach_caixote","Sentar e levantar no caixote","Caixote + halter opcional","Quadríceps, glúteos",1,[],"c",2,
 ["Caixote atrás de você, numa altura em que o joelho fique perto de 90°.","Braços à frente ou halter junto ao peito.","Sente controlando até encostar de leve, sem relaxar no caixote.","Levante empurrando o chão com o pé inteiro."],
 ["Despencar no caixote.","Usar impulso do tronco para levantar."]);
E("agach_goblet","Agachamento goblet","Halter ou kettlebell","Quadríceps, glúteos, core",1,["joelho"],"c",2,
 ["Segure o halter na vertical, junto ao peito.","Pés um pouco mais afastados que o quadril.","Desça como se fosse sentar entre os calcanhares, mantendo o tronco alto.","Suba empurrando o chão, joelhos na direção dos pés."],
 ["Calcanhar saindo do chão.","Joelhos caindo para dentro.","Arredondar as costas no fundo."]);
E("agach_smith","Agachamento no Smith","Cross Smith (barra guiada)","Quadríceps, glúteos",2,["joelho","lombar"],"c",5,
 ["Ajuste as travas de segurança logo abaixo da sua amplitude.","Barra apoiada no trapézio (nunca no pescoço), pés levemente à frente da barra.","Destrave girando a barra e desça até a coxa ficar paralela, ou até onde a coluna continuar neutra.","Suba e trave nos ganchos girando a barra."],
 ["Pés embaixo da barra (sobrecarrega o joelho).","Treinar sem as travas de segurança."]);
E("rdl_halter","Terra romeno com halteres","Halteres","Posteriores de coxa, glúteos, lombar",1,["lombar"],"c",2,
 ["Em pé, halteres à frente das coxas, joelhos levemente flexionados.","Empurre o quadril para trás, deslizando os halteres rente às pernas.","Desça até sentir alongar atrás da coxa (geralmente até o joelho/canela), costas retas.","Volte contraindo os glúteos."],
 ["Arredondar a coluna.","Transformar em agachamento.","Afastar os halteres do corpo."]);
E("rdl_barra","Terra romeno com barra","Barra reta + anilhas","Posteriores de coxa, glúteos, lombar",2,["lombar"],"c",5,
 ["Pegada na largura dos ombros, barra encostada nas coxas.","Leve o quadril para trás com joelhos levemente dobrados.","A barra desce rente às pernas até o meio da canela ou até onde a coluna continuar neutra.","Suba empurrando o quadril para frente."],
 ["Coluna arredondada.","Barra longe do corpo.","Hiperestender a lombar no topo."]);
E("hip_thrust","Elevação de quadril no banco","Banco + barra com anilhas ou halter","Glúteos, posteriores",1,[],"c",5,
 ["Apoie a parte de cima das costas na borda do banco, pés firmes no chão.","Carga sobre o quadril (proteja com colchonete dobrado).","Suba até o tronco ficar alinhado com as coxas, queixo recolhido; segure 1 s.","Desça controlando."],
 ["Arquear a lombar no topo em vez de contrair o glúteo.","Empurrar com a ponta dos pés."]);
E("ponte_gluteo","Ponte de glúteo no solo","Colchonete + halter opcional","Glúteos, posteriores",1,[],"c",2,
 ["Deitado de barriga para cima, joelhos dobrados e pés no chão.","Contraia o abdômen e eleve o quadril até alinhar joelho, quadril e ombro.","Segure 2 s no topo e desça devagar."],
 ["Subir arqueando a lombar.","Afastar demais os pés do quadril."]);
E("kb_swing","Kettlebell swing","Kettlebell","Glúteos, posteriores, core",2,["lombar","ombro"],"c",4,
 ["Pés na largura dos ombros, kettlebell um pouco à frente.","Dobre o quadril (não agache) e leve o kettlebell entre as pernas.","Projete o quadril à frente com força; o kettlebell sobe até a altura do peito pelo impulso.","Deixe descer e repita o movimento do quadril."],
 ["Levantar o peso com os braços.","Agachar em vez de dobrar o quadril.","Arredondar as costas."]);
E("avanco_halter","Avanço com halteres","Halteres","Quadríceps, glúteos",1,["joelho"],"c",2,
 ["Dê um passo largo à frente.","Desça até o joelho de trás quase tocar o chão, tronco reto.","Joelho da frente alinhado com o pé.","Volte empurrando o calcanhar da frente e alterne as pernas."],
 ["Joelho da frente caindo para dentro.","Passo curto demais (joelho passa muito da ponta do pé)."],{ps:true});
E("step_caixote","Subida no caixote","Caixote + halteres","Quadríceps, glúteos",1,["joelho"],"c",2,

const esc=s=>String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const today=()=>{const d=new Date();return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")};
const fmtDate=s=>{if(!s)return"";const [y,m,d]=s.slice(0,10).split("-");return d+"/"+m+"/"+y.slice(2)};
const daysBetween=(a,b)=>Math.round((new Date(b)-new Date(a))/864e5);
const num=v=>{const n=parseFloat(String(v).replace(",","."));return isFinite(n)?n:null};
const fmtKg=n=>n==null?"–":(Math.round(n*10)/10).toString().replace(".",",");

/* ============================================================
   GERADOR DA ROTINA
   ============================================================ */
function effLevel(p){ let l=+p.nivel||1; if(p.idade>=60) l=Math.min(l,2); return l }
function weeksIn(p){ return Math.floor(daysBetween(p.inicio||today(),today())/7) }
function inAdaptation(p){ return (+p.nivel===1) && weeksIn(p)<2 }
function cardioPlan(p){
  const fcmax=Math.round(208-0.7*p.idade);
  const z2=[Math.round(fcmax*.6),Math.round(fcmax*.7)], z3=[Math.round(fcmax*.7),Math.round(fcmax*.8)];
  let min=10, desc="10 min leves no fim do treino (opcional) para recuperar.";
  if(p.objetivo==="emagrecer"){min=20;desc="20–30 min em zona 2 depois da musculação (esteira inclinada, bike ou elíptico). Você deve conseguir conversar com frases curtas."}
  if(p.objetivo==="saude"){min=15;desc="15–20 min em zona 2–3 depois da musculação, variando entre esteira, bike e elíptico."}
  const extra=(p.bioAdj&&+p.bioAdj.cardioExtra)||0;
  if(extra) desc+=" Ajuste da bioimpedância: some mais "+extra+" min de cardio leve por semana, em dias de descanso ou depois do treino.";
  return {min,desc,fcmax,z2,z3};
}
function rx(ex,p){
  const lvl=effLevel(p), adapt=inAdaptation(p), g=p.objetivo, comp=ex.t==="c";
  let sets = adapt?2 : lvl===3&&comp?4 : 3;
  let lo,hi;
  if(ex.t==="t"){ const T=lvl===1?[20,30]:lvl===2?[30,45]:[40,60]; return {sets,lo:T[0],hi:T[1],unit:"s",rest:45,rir:null,txt:T[0]+"–"+T[1]+" s"+(ex.ps?" por lado":"")} }
  const R={hipertrofia:comp?[8,12]:[10,15],forca:comp?(lvl===1?[8,10]:[4,6]):[8,12],emagrecer:comp?[10,15]:[12,15],saude:comp?[10,12]:[12,15]}[g]||[10,12];
  [lo,hi]=R;
  if(p.lim&&p.lim.indexOf("hipertensao")>=0&&lo<10){lo=10;hi=Math.max(hi,12)}
  if(adapt){lo=Math.max(lo,10);hi=Math.max(hi,15)}
  const RS={forca:comp?150:90,hipertrofia:comp?90:60,emagrecer:comp?60:45,saude:comp?75:60}[g]||75;
  let rir = adapt?4 : lvl===1?3 : lvl===2?2 : 1;
  if(p.lim&&p.lim.indexOf("hipertensao")>=0) rir=Math.max(rir,3);
  return {sets,lo,hi,unit:"reps",rest:RS,rir,txt:lo+"–"+hi+" reps"+(ex.ps?" por lado":"")};
}
function exCount(p){
  const c=cardioPlan(p).min>=15?cardioPlan(p).min:0;
  return Math.max(4,Math.min(8,Math.round(((+p.duracao||60)-10-c)/8.5)));
}
function dayTemplate(p){
  const lvl=effLevel(p), d=+p.dias||3, g=p.objetivo;
  let keys;
  if(d<=2) keys=["FA","FB"];
  else if(d===3) keys=(lvl>=2&&(g==="hipertrofia"||g==="forca"))?["PUSH","PULL","LEGS"]:["FA","FB","FC"];
  else if(d===4) keys=lvl===1?["FA","FB","FC","FA"].slice(0,3).concat(["CARDIO"]):["UP","LOW","UP2","LOW2"];
  else if(d===5) keys=lvl===1?["FA","FB","FC","CARDIO","CARDIO"]:["PUSH","PULL","LEGS","UP","LOW"];
  else keys=lvl===1?["FA","FB","FC","CARDIO","CARDIO","CARDIO"]:["PUSH","PULL","LEGS","PUSH","PULL","LEGS"];
  return keys;
}
function buildPlan(p){
  const lvl=effLevel(p), lim=p.lim||[], n=exCount(p);
  const foco=(p.bioAdj&&p.bioAdj.foco)||[];
  const keys=dayTemplate(p);
  const seen={};
  const days=keys.map((k,i)=>{
    const tpl=DAYS[k]; const letter=String.fromCharCode(65+i);
    seen[k]=(seen[k]||0)+1;
    let slots=tpl.slots.slice();
    if(foco.indexOf("core")>=0 && slots.length && slots.indexOf("core2")<0) slots.splice(Math.min(n-1,slots.length),0,"core2");
    const used=new Set(), ex=[];
    for(const s of slots){
      if(ex.length>=n) break;
      let list=SLOTS[s].slice(); if(seen[k]===2) list.push(list.shift()); // repetição na semana: varia o 1º exercício
      const id=list.find(x=>{const e=EX[x];return e.lv<=lvl&&!e.av.some(a=>lim.indexOf(a)>=0)&&!used.has(x)});
      if(!id) continue; used.add(id); ex.push(Object.assign({id},rx(EX[id],p)));
    }
    return {key:letter,tpl:k,n:tpl.n,f:tpl.f,g:tpl.g,ex};
  });
  return {days,cardio:cardioPlan(p),adapt:inAdaptation(p),lvl};
}
function nextDayIndex(plan){
  const last=S.logs.slice().reverse().find(l=>l.day); if(!last) return 0;
  const i=plan.days.findIndex(d=>d.key===last.day); return i<0?0:(i+1)%plan.days.length;
}
function lastSets(id){
  for(let i=S.logs.length-1;i>=0;i--){const e=(S.logs[i].entries||[]).find(x=>x.id===id); if(e&&e.sets.some(s=>s.done)) return {date:S.logs[i].date,sets:e.sets.filter(s=>s.done)}}
  return null;
}
function suggestion(item){
  const ex=EX[item.id], last=lastSets(item.id); if(!last) return null;
  const kgs=last.sets.map(s=>num(s.kg)).filter(v=>v!=null); const top=kgs.length?Math.max(...kgs):null;
  const allTop=last.sets.length>=item.sets&&last.sets.every(s=>(num(s.reps)||0)>=item.hi);
  const lastTxt=last.sets.map(s=>(s.kg!==""&&s.kg!=null?fmtKg(num(s.kg))+"kg×":"")+(s.reps||"?")).join(" · ");
  if(allTop&&top!=null&&ex.inc) return {last:lastTxt,kg:top+ex.inc,msg:"Você bateu o topo da faixa em todas as séries: suba para "+fmtKg(top+ex.inc)+" kg."};
  if(allTop&&!ex.inc) return {last:lastTxt,kg:top,msg:"Bateu o topo da faixa: aumente a dificuldade (mais tempo, pausa de 2 s ou variação mais difícil)."};
  return {last:lastTxt,kg:top,msg:top!=null?"Mantenha "+fmtKg(top)+" kg e tente somar 1 repetição por série.":"Tente somar 1 repetição por série."};
}

function blobToB64(b){return new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>res(String(r.result).split(",")[1]);r.onerror=rej;r.readAsDataURL(b)})}
async function askAI(prompt,images){
  if(S.ai.sample){
    const opts={modelTier:"default"}; if(images&&images.length&&S.ai.images) opts.images=images;
    return await S.ai.sample.json(prompt,opts);
  }
  const key=lsGet(APIKEY_KEY); if(!key) throw {code:"no_ai"};
  const content=[];
  for(const img of images||[]) content.push({type:"image",source:{type:"base64",media_type:img.type||"image/jpeg",data:await blobToB64(img)}});
  content.push({type:"text",text:prompt});
  const r=await fetch("https://api.anthropic.com/v1/messages",{method:"POST",headers:{"content-type":"application/json","x-api-key":key,"anthropic-version":"2023-06-01","anthropic-dangerous-direct-browser-access":"true"},
    body:JSON.stringify({model:"claude-sonnet-5-5",max_tokens:3000,messages:[{role:"user",content}]})});
  if(!r.ok) throw {code:"http_"+r.status,message:"A API respondeu com erro "+r.status+". Confira a chave."};
  const j=await r.json(); const t=(j.content||[]).map(c=>c.text||"").join("");
  const m=t.match(/\{[\s\S]*\}/); if(!m) throw {code:"parse",message:"A resposta da IA veio num formato inesperado. Tente de novo."};
  return JSON.parse(m[0]);
}
function bioPrompt(p,vals,text,nImgs){
  return `Você é um profissional de educação física e avaliação física experiente. Analise a bioimpedância abaixo de uma pessoa que treina na academia de um prédio residencial e sugira ajustes de treino. Não faça diagnóstico médico; quando algo indicar risco, recomende procurar médico ou nutricionista.

PERFIL: ${p.sexo==="f"?"mulher":"homem"}, ${p.idade} anos, ${p.altura} cm, ${p.peso} kg. Objetivo: ${GOALS[p.objetivo]}. Nível: ${LEVELS[p.nivel]}. Limitações: ${(p.lim||[]).map(l=>LIMS[l]).join(", ")||"nenhuma"}. Treina ${p.dias}x por semana, ${p.duracao} min.
VALORES DIGITADOS: ${JSON.stringify(vals)}
TEXTO COLADO DO LAUDO: ${text||"(nenhum)"}
${nImgs?`ANEXOS: ${nImgs} imagem(ns) do laudo da bioimpedância. Leia os valores delas.`:""}
EQUIPAMENTOS DISPONÍVEIS: ${EQUIPAMENTOS.join(", ")}.

Responda SOMENTE com um JSON válido, em português do Brasil, neste formato:
{"resumo":"2 a 4 frases simples sobre o estado atual",
"valores_extraidos":{"peso":numero|null,"gordura_pct":numero|null,"massa_muscular_kg":numero|null,"gordura_visceral":numero|null,"agua_pct":numero|null,"tmb_kcal":numero|null},
"metricas":[{"nome":"...","valor":"...","avaliacao":"bom"|"atencao"|"alto"|"baixo","comentario":"curto"}],
"pontos_atencao":["..."],
"recomendacoes_treino":["recomendações práticas usando os equipamentos disponíveis"],
"ajustes":{"objetivo_sugerido":"emagrecer"|"hipertrofia"|"forca"|"saude"|null,"cardio_extra_min_semana":numero,"foco":["core"|"membros_inferiores"|"membros_superiores"|"mobilidade"],"justificativa":"curta"},
"procurar_profissional":"texto curto ou null"}`;
}
function ruleBio(p,v){
  const out=[]; const age=p.idade, f=p.sexo==="f";
  const bmi=p.peso&&p.altura?p.peso/Math.pow(p.altura/100,2):null;
  if(bmi){const s=bmi<18.5?["baixo","Abaixo do recomendado"]:bmi<25?["bom","Faixa adequada"]:bmi<30?["atencao","Sobrepeso pelo IMC (o IMC não diferencia músculo de gordura)"]:["alto","Obesidade pelo IMC; a % de gordura dá uma leitura melhor"];out.push({nome:"IMC",valor:fmtKg(bmi),avaliacao:s[0],comentario:s[1]})}
  if(v.gordura_pct!=null){
    const R=f?(age<40?[21,33]:age<60?[23,34]:[24,36]):(age<40?[8,20]:age<60?[11,22]:[13,25]);
    const g=v.gordura_pct; const s=g<R[0]?["baixo","Abaixo da faixa saudável para sua idade"]:g<=R[1]?["bom","Dentro da faixa saudável ("+R[0]+"–"+R[1]+"%)"]:["alto","Acima da faixa saudável ("+R[0]+"–"+R[1]+"%)"];
    out.push({nome:"Gordura corporal",valor:fmtKg(g)+"%",avaliacao:s[0],comentario:s[1]});
  }
  if(v.gordura_visceral!=null){const g=v.gordura_visceral;out.push({nome:"Gordura visceral",valor:fmtKg(g),avaliacao:g<=9?"bom":g<=12?"atencao":"alto",comentario:g<=9?"Nível adequado (escala 1–59 da maioria das balanças)":g<=12?"No limite: cardio regular ajuda a reduzir":"Elevada: priorize cardio e converse com um médico"})}
  if(v.agua_pct!=null){const R=f?[45,60]:[50,65];const a=v.agua_pct;out.push({nome:"Água corporal",valor:fmtKg(a)+"%",avaliacao:a<R[0]?"baixo":a>R[1]?"atencao":"bom",comentario:a<R[0]?"Abaixo do esperado: hidrate-se melhor e repita o exame nas mesmas condições":"Faixa esperada "+R[0]+"–"+R[1]+"%"})}
  if(v.massa_muscular_kg!=null&&p.peso){const pct=v.massa_muscular_kg/p.peso*100;out.push({nome:"Massa muscular",valor:fmtKg(v.massa_muscular_kg)+" kg ("+Math.round(pct)+"%)",avaliacao:"bom",comentario:"Use como referência para comparar com o próximo exame"})}
  if(v.tmb_kcal!=null) out.push({nome:"Taxa metabólica basal",valor:Math.round(v.tmb_kcal)+" kcal",avaliacao:"bom",comentario:"Energia gasta em repouso; base para um nutricionista calcular sua dieta"});
  return out;
}

function sparkline(vals,w,h){
  if(vals.length<2) return "";
  const mn=Math.min(...vals),mx=Math.max(...vals),r=mx-mn||1;
  const pts=vals.map((v,i)=>[2+i*(w-4)/(vals.length-1),h-3-(v-mn)/r*(h-6)]);
  const d=pts.map((p,i)=>(i?"L":"M")+p[0].toFixed(1)+" "+p[1].toFixed(1)).join(" ");
  const last=pts[pts.length-1];
  return `<svg class="spark" width="${w}" height="${h}" viewBox="0 0 ${w} ${h}" aria-hidden="true"><path d="${d} L${last[0].toFixed(1)} ${h} L2 ${h}Z" fill="var(--accent)" fill-opacity=".25"/><path d="${d}" fill="none" stroke="var(--ink)" stroke-width="1.6"/><circle cx="${last[0]}" cy="${last[1]}" r="2.8" fill="var(--ink)"/></svg>`;
}

let timerInt=null, audioCtx=null;
function beep(){try{audioCtx=audioCtx||new (window.AudioContext||window.webkitAudioContext)();[0,0.25,0.5].forEach(t=>{const o=audioCtx.createOscillator(),g=audioCtx.createGain();o.frequency.value=880;o.connect(g);g.connect(audioCtx.destination);g.gain.setValueAtTime(.2,audioCtx.currentTime+t);o.start(audioCtx.currentTime+t);o.stop(audioCtx.currentTime+t+.15)})}catch(e){}try{navigator.vibrate&&navigator.vibrate([200,100,200])}catch(e){}}
function startTimer(sec){ S.timer={end:Date.now()+sec*1000,total:sec}; try{audioCtx=audioCtx||new (window.AudioContext||window.webkitAudioContext)()}catch(e){} clearInterval(timerInt); timerInt=setInterval(renderTimer,250); renderTimer(); }
function renderTimer(){
  const el=document.getElementById("timer");
  if(!S.timer){el.hidden=true;return}
  const left=Math.max(0,Math.ceil((S.timer.end-Date.now())/1000));
  if(left<=0){clearInterval(timerInt);S.timer=null;el.hidden=true;beep();return}
  el.hidden=false;
  const pct=100*(1-left/S.timer.total);
  el.innerHTML=`<div class="in" role="timer" aria-label="Descanso"><span class="t">${Math.floor(left/60)}:${String(left%60).padStart(2,"0")}</span><span class="bar"><i style="width:${pct}%"></i></span><button data-act="t+">+15 s</button><button data-act="tskip">Pular</button></div>`;
}

/* ============================================================
   EVENTOS
   ============================================================ */
function saveDraft(){lsSet(DRAFT_KEY,S.session)}
function flash(t,k){S.msg={t,k};render();clearTimeout(flash._t);flash._t=setTimeout(()=>{S.msg=null;safeRender()},4000)}
let wakeLock=null;
async function keepAwake(on){try{if(on&&navigator.wakeLock){wakeLock=await navigator.wakeLock.request("screen")}else if(wakeLock){await wakeLock.release();wakeLock=null}}catch(e){}}

document.addEventListener("click",async ev=>{
  const b=ev.target.closest("[data-act]"); if(!b) return;
  const a=b.dataset.act;
  if(a==="pick"){S.pickDay=+b.dataset.i;render();return}
  if(a==="anim-toggle"){S.animPaused=!S.animPaused;document.querySelectorAll('[data-act="anim-toggle"]').forEach(x=>{x.textContent=S.animPaused?"▶ animar":"❚❚ pausar";x.setAttribute("aria-label",(S.animPaused?"Animar":"Pausar")+" ilustrações")});return}
  if(a==="start"){const plan=buildPlan(S.profile);const d=plan.days[+b.dataset.i];S.session={day:d.key,dayName:d.n,started:Date.now(),entries:{}};saveDraft();keepAwake(true);render();return}
  if(a==="done"){const id=b.dataset.ex,k=+b.dataset.k;const arr=S.session.entries[id]=S.session.entries[id]||[];
    const kgI=document.getElementById("kg-"+id+"-"+k),rpI=document.getElementById("rp-"+id+"-"+k);
    const s=arr[k]=Object.assign(arr[k]||{},{kg:kgI.value,reps:rpI.value||rpI.placeholder.split("–").pop()});
    s.done=!s.done; if(s.done&&!rpI.value) rpI.value=s.reps; saveDraft();
    b.closest(".set").classList.toggle("done",s.done); b.textContent=s.done?"✓":"";
    if(s.done) startTimer(+b.dataset.rest); return}
  if(a==="t+"){if(S.timer){S.timer.end+=15000;S.timer.total+=15;renderTimer()}return}
  if(a==="tskip"){S.timer=null;clearInterval(timerInt);renderTimer();return}
  if(a==="cancel"){S.confirm="cancel";render();return}
  if(a==="confirm-no"){S.confirm=null;render();return}
  if(a==="cancel-yes"){S.session=null;S.confirm=null;saveDraft();keepAwake(false);S.timer=null;render();return}
  if(a==="finish"){
    const s=S.session, entries=Object.keys(s.entries).map(id=>({id,sets:s.entries[id].filter(Boolean).map(x=>({kg:x.kg===""?null:num(x.kg),reps:num(x.reps),done:!!x.done}))})).filter(e=>e.sets.some(x=>x.done));
    if(!entries.length){flash("Marque pelo menos uma série como feita antes de finalizar.","bad");return}
    const log={id:String(Date.now()),date:today(),day:s.day,dayName:s.dayName,min:Math.round((Date.now()-s.started)/60000),entries};
    S.logs.push(log); S.session=null; saveDraft(); keepAwake(false); S.timer=null; S.pickDay=null;
    try{await store.put("log_"+log.id,log)}catch(e){}
    location.hash="#progresso"; flash("Treino salvo. Boa! Descanse e hidrate-se.","ok"); return}
  if(a==="dellog"){S.confirm="dellog:"+b.dataset.id;render();return}
  if(a==="dellog-yes"){const id=S.confirm.slice(7);S.logs=S.logs.filter(l=>l.id!==id);S.confirm=null;try{await store.del("log_"+id)}catch(e){}render();return}
  if(a==="cancel-edit"){S.editProfile=false;render();return}
  if(a==="wipe"){S.confirm="wipe";render();return}
  if(a==="wipe-yes"){const ids=S.logs.map(l=>"log_"+l.id).concat(["profile","bio"]);S.profile=null;S.bio=null;S.logs=[];S.session=null;S.confirm=null;saveDraft();
    for(const id of ids){try{await store.del(id)}catch(e){}} if(store.mode==="local") lsSet(LS_KEY,null); location.hash="#perfil"; render(); return}
  if(a==="clear-key"){lsSet(APIKEY_KEY,null);render();return}
  if(a==="clear-imgs"){S.bioDraft.urls&&S.bioDraft.urls.forEach(u=>URL.revokeObjectURL(u));S.bioDraft.imgs=[];S.bioDraft.urls=[];render();return}
  if(a==="save-bio"||a==="analyze"){
    const vals=readBioFields(); S.bioDraft.text=(document.getElementById("bio-text")||{}).value||"";
    const hasData=Object.values(vals).some(v=>v!=null)||S.bioDraft.text.trim()||S.bioDraft.imgs.length;
    if(!hasData){flash("Anexe o laudo, cole o texto ou preencha pelo menos um valor.","bad");return}
    let bio={data:today(),valores:vals,ia:(S.bio&&a==="save-bio")?S.bio.ia:null};
    if(a==="analyze"){
      S.busy=true;render();
      try{
        const res=await askAI(bioPrompt(S.profile,vals,S.bioDraft.text,S.bioDraft.imgs.length),S.bioDraft.imgs);
        const ex=res.valores_extraidos||{}; Object.keys(ex).forEach(k=>{if(bio.valores[k]==null&&typeof ex[k]==="number") bio.valores[k]=ex[k]});
        bio.ia=res;
      }catch(e){S.busy=false;flash(e&&e.code==="not_granted"?"Você não permitiu o uso do Claude nesta página. Os valores digitados ainda podem ser salvos.":e&&e.code==="rate_limited"?"Limite de uso da IA atingido agora. Tente de novo mais tarde.":(e&&e.message)||"Não foi possível analisar agora. Tente de novo.","bad");return}
      S.busy=false;
    }
    S.bio=bio; S.bioDraft.text="";
    try{await store.put("bio",bio)}catch(e){}
    flash(a==="analyze"?"Análise pronta.":"Valores salvos.","ok"); return}
  if(a==="apply-bio"){const aj=S.bio.ia.ajustes||{};const p=Object.assign({},S.profile);
    p.bioAdj={cardioExtra:+aj.cardio_extra_min_semana||0,foco:aj.foco||[]};
    if(aj.objetivo_sugerido&&GOALS[aj.objetivo_sugerido]) p.objetivo=aj.objetivo_sugerido;
    S.profile=p; try{await store.put("profile",p)}catch(e){} flash("Rotina ajustada com base na bioimpedância.","ok"); return}
  if(a==="clear-bio"){const p=Object.assign({},S.profile);delete p.bioAdj;S.profile=p;try{await store.put("profile",p)}catch(e){}flash("Ajustes removidos.","ok");return}
  if(a==="edit"){S.editProfile=true;render();return}
});
function readBioFields(){const o={};["peso","gordura_pct","massa_muscular_kg","gordura_visceral","agua_pct","tmb_kcal"].forEach(k=>{const el=document.getElementById("bio-"+k);o[k]=el?num(el.value):null});return o}

document.addEventListener("input",ev=>{
  const t=ev.target;
  if(t.dataset&&t.dataset.ex&&S.session){const arr=S.session.entries[t.dataset.ex]=S.session.entries[t.dataset.ex]||[];const k=+t.dataset.k;arr[k]=arr[k]||{};arr[k][t.dataset.f]=t.value;saveDraft()}
  if(t.id==="bio-text") S.bioDraft.text=t.value;
});
document.addEventListener("change",ev=>{
  const t=ev.target;
  if(t.id==="bio-files"){const files=Array.from(t.files||[]).slice(0,5);S.bioDraft.urls&&S.bioDraft.urls.forEach(u=>URL.revokeObjectURL(u));S.bioDraft.imgs=files;S.bioDraft.urls=files.map(f=>URL.createObjectURL(f));render()}
});
document.addEventListener("submit",async ev=>{
  const f=ev.target; ev.preventDefault();
  if(f.dataset.form==="perfil"){
    const fd=new FormData(f), err=[];
    const p=Object.assign({},S.profile||{});
    p.nome=(fd.get("nome")||"").trim(); p.sexo=fd.get("sexo")||"m";
    p.idade=parseInt(fd.get("idade"),10); p.peso=num(fd.get("peso")); p.altura=parseInt(fd.get("altura"),10);
    p.objetivo=fd.get("objetivo")||"saude"; p.nivel=fd.get("nivel")||"1"; p.dias=+fd.get("dias"); p.duracao=+fd.get("duracao");
    p.lim=fd.getAll("lim"); p.parq=PARQ.map((_,i)=>fd.get("parq"+i)==="1");
    if(!p.nome) err.push("Informe seu nome.");
    if(!(p.idade>=14&&p.idade<=95)) err.push("Idade entre 14 e 95 anos.");
    if(!(p.peso>=30&&p.peso<=250)) err.push("Peso entre 30 e 250 kg.");
    if(!(p.altura>=120&&p.altura<=220)) err.push("Altura em centímetros, entre 120 e 220.");
    const box=document.getElementById("form-err");
    if(err.length){box.hidden=false;box.innerHTML="<p>"+err.map(esc).join("<br>")+"</p>";box.scrollIntoView({block:"center"});return}
    if(!p.inicio) p.inicio=today();
    const W=(p.pesos||[]).slice(); if(!W.length||W[W.length-1].kg!==p.peso) W.push({date:today(),kg:p.peso}); p.pesos=W.slice(-60);
    const isNew=!S.profile; S.profile=p; S.editProfile=false;
    try{await store.put("profile",p)}catch(e){}
    location.hash="#hoje"; flash(isNew?"Rotina criada! Comece pelo aquecimento.":"Perfil atualizado e rotina recalculada.","ok"); return;
  }
  if(f.dataset.form==="peso"){const v=num(document.getElementById("novo-peso").value);if(!(v>=30&&v<=250)){flash("Digite um peso entre 30 e 250 kg.","bad");return}
    const p=Object.assign({},S.profile);p.peso=v;p.pesos=(p.pesos||[]).concat([{date:today(),kg:v}]).slice(-60);S.profile=p;try{await store.put("profile",p)}catch(e){}flash("Peso registrado.","ok");return}
  if(f.dataset.form==="apikey"){const v=document.getElementById("api-key").value.trim();if(v){lsSet(APIKEY_KEY,v);flash("Chave salva neste navegador.","ok")}return}
});
window.addEventListener("hashchange",()=>{S.confirm=null;if(location.hash==="#perfil"&&S.profile) S.editProfile=false;render();window.scrollTo(0,0)});
// botão editar perfil: a aba Perfil abre o formulário preenchido
render();
if(!reduceMotion) requestAnimationFrame(animLoop);
store.connect();
initAI();
</script>
